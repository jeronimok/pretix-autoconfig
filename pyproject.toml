[project]
name = "pretix-autoconfig"
dynamic = ["version"]
description = "Auto-configure fees and payment methods on event creation"
readme = "README.rst"
license = {text = "AGPL-3.0"}
keywords = ["pretix"]
authors = [
    {name = "Jeronimo Calace Montu", email = "jeronimo.calace@gmail.com"},
]
maintainers = [
    {name = "Jeronimo Calace Montu", email = "jeronimo.calace@gmail.com"},
]

dependencies = [
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]

[project.entry-points."pretix.plugin"]
pretix_autoconfig = "pretix_autoconfig"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/jeronimok/pretix-autoconfig"
repository = "https://github.com/jeronimok/pretix-autoconfig"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_autoconfig.__version__"}

[tool.setuptools.packages.find]
include = ["pretix_autoconfig*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "*/migrations/*",
    "env/",
    "build/",
    "*.egg-info/",
    "__pycache__/",
    "setup.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E402", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["pretix_autoconfig"]
known-third-party = ["pretix"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
